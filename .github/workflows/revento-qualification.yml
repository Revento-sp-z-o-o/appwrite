name: Revento patch qualification

on:
  pull_request:
    branches: [revento/2.0-maintenance, revento/relationship-lookup-candidate, revento/sync-timeout]
    paths: [revento/**, docker-compose.yml, .github/workflows/revento-qualification.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relationships:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        env:
          POSTGRES_USER: relation_probe
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: relation_probe
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U relation_probe"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify qualification target guards
        run: python3 revento/tests/test_qualification_guards.py -v
      - name: Verify deadline qualification cleanup recovery
        run: python3 revento/tests/test_eng2093_cleanup.py -v
      - name: Verify prefix qualification cleanup recovery
        run: python3 revento/tests/test_eng2114_cleanup.py -v
      - name: Verify maintained Compose environment forwarding
        run: python3 revento/tests/eng2082-compose.py
      - name: Build pinned candidate
        run: docker build --platform linux/amd64 -f revento/Dockerfile -t revento/appwrite:qualification .
      - name: Compare actual packaged database code
        env:
          UPSTREAM_IMAGE: appwrite/appwrite@sha256:27ca3f70d06fb0f4751e93cba03c49f96562236986f9b688185ee1c0e1f7e9aa
        run: |
          set -euo pipefail
          for variant in original candidate; do
            image="$UPSTREAM_IMAGE"
            if [ "$variant" = candidate ]; then image=revento/appwrite:qualification; fi
            for cache in memory redis; do
              docker run --rm --network host --entrypoint php \
                --mount "type=bind,source=$GITHUB_WORKSPACE/revento,target=/qualification,readonly" \
                -e REVENTO_DATABASE_AUTOLOAD=/usr/src/code/vendor/autoload.php \
                -e REVENTO_DATABASE_SOURCE=/usr/src/code/vendor/utopia-php/database/src/Database/Database.php \
                -e 'RELATION_PG_DSN=pgsql:host=127.0.0.1;port=5432;dbname=relation_probe' \
                -e RELATION_PG_USER=relation_probe \
                -e RELATION_PG_PASSWORD=synthetic-ci-only \
                -e "RELATION_CACHE=$cache" \
                "$image" /qualification/tests/relationships.php "$variant" > "$variant-$cache.json"
              cat "$variant-$cache.json"
            done
          done
          python3 - <<'PY'
          import json
          for cache in ('memory', 'redis'):
              before = json.load(open(f'original-{cache}.json'))
              after = json.load(open(f'candidate-{cache}.json'))
              assert before['passed'] and after['passed']
              assert before['checks'] == after['checks']
              assert after['metrics']['cache_loads'] < before['metrics']['cache_loads']
          PY

      - name: Qualify explicit PostgreSQL prefixes and unchanged search controls
        env:
          UPSTREAM_IMAGE: appwrite/appwrite@sha256:27ca3f70d06fb0f4751e93cba03c49f96562236986f9b688185ee1c0e1f7e9aa
        run: |
          set -euo pipefail
          mkdir prefix-results
          docker run --rm --network host --entrypoint php revento/appwrite:qualification -r \
            '(new PDO("pgsql:host=127.0.0.1;port=5432;dbname=relation_probe", "relation_probe", "synthetic-ci-only"))->exec("CREATE DATABASE eng2114_prefix_ci");'
          for variant in original candidate; do
            image="$UPSTREAM_IMAGE"
            if [ "$variant" = candidate ]; then image=revento/appwrite:qualification; fi
            baseline=()
            if [ "$variant" = candidate ]; then baseline=(--baseline=/results/original.json); fi
            status=0
            docker run --rm --network host --entrypoint php \
              --mount "type=bind,source=$GITHUB_WORKSPACE/revento,target=/qualification,readonly" \
              --mount "type=bind,source=$GITHUB_WORKSPACE/prefix-results,target=/results" \
              -e 'ENG2114_PREFIX_PG_DSN=pgsql:host=127.0.0.1;port=5432;dbname=eng2114_prefix_ci' \
              -e ENG2114_PREFIX_PG_USER=relation_probe \
              -e ENG2114_PREFIX_PG_PASSWORD=synthetic-ci-only \
              "$image" /qualification/tests/eng2114-prefix.php --execute-local \
              "--variant=$variant" --group=all \
              --autoload=/usr/src/code/vendor/autoload.php \
              --adapter-source=/usr/src/code/vendor/utopia-php/database/src/Database/Adapter/Postgres.php \
              "--output=/results/$variant.json" "${baseline[@]}" || status=$?
            if [ "$variant" = original ]; then test "$status" -eq 1; else test "$status" -eq 0; fi
          done
          python3 - <<'PYCODE'
          import json
          before = json.load(open('prefix-results/original.json'))
          after = json.load(open('prefix-results/candidate.json'))
          assert not before['passed'] and 'three_character_prefix' in before['failures']
          assert after['passed'] and not after['failures']
          assert len(before['checks']) == len(after['checks']) == 62
          assert before['controls'] == after['controls']
          assert before['temporary_transaction_rolled_back'] and after['temporary_transaction_rolled_back']
          PYCODE

      - name: Qualify bounded transaction event reads
        run: |
          set -euo pipefail
          for variant in original candidate; do
            source=/usr/src/code/src/Appwrite/Databases/TransactionState.php
            if [ "$variant" = original ]; then source=/baseline/TransactionState.php; fi
            for cache in memory redis; do
              docker run --rm --network host --entrypoint php \
                --mount "type=bind,source=$GITHUB_WORKSPACE/revento,target=/qualification,readonly" \
                --mount "type=bind,source=$GITHUB_WORKSPACE/src/Appwrite/Databases/TransactionState.php,target=/baseline/TransactionState.php,readonly" \
                -e REVENTO_DATABASE_AUTOLOAD=/usr/src/code/vendor/autoload.php \
                -e REVENTO_DATABASE_SOURCE=/usr/src/code/vendor/utopia-php/database/src/Database/Database.php \
                -e "REVENTO_TRANSACTION_SOURCE=$source" \
                -e 'RELATION_PG_DSN=pgsql:host=127.0.0.1;port=5432;dbname=relation_probe' \
                -e RELATION_PG_USER=relation_probe \
                -e RELATION_PG_PASSWORD=synthetic-ci-only \
                -e "RELATION_CACHE=$cache" \
                revento/appwrite:qualification /qualification/tests/eng2083-transaction-events.php "$variant" > "eng2083-$variant-$cache.json"
              cat "eng2083-$variant-$cache.json"
            done
          done
          python3 - <<'PYCODE'
          import json
          for cache in ('memory', 'redis'):
              before = json.load(open(f'eng2083-original-{cache}.json'))
              after = json.load(open(f'eng2083-candidate-{cache}.json'))
              assert before['passed'] and after['passed']
              assert before['checks'] == after['checks']
              assert after['metrics']['cache_loads'] < before['metrics']['cache_loads'] / 10
          PYCODE

      - name: Qualify transaction staging and locked old-row reads
        run: |
          docker run --rm --network host --entrypoint php \
            --mount "type=bind,source=$GITHUB_WORKSPACE/revento,target=/qualification,readonly" \
            -e REVENTO_DATABASE_AUTOLOAD=/usr/src/code/vendor/autoload.php \
            -e REVENTO_DATABASE_SOURCE=/usr/src/code/vendor/utopia-php/database/src/Database/Database.php \
            -e REVENTO_TRANSACTION_SOURCE=/usr/src/code/src/Appwrite/Databases/TransactionState.php \
            -e 'RELATION_PG_DSN=pgsql:host=127.0.0.1;port=5432;dbname=relation_probe' \
            -e RELATION_PG_USER=relation_probe \
            -e RELATION_PG_PASSWORD=synthetic-ci-only \
            revento/appwrite:qualification /qualification/tests/eng2084-transaction-reads.php candidate

      - name: Qualify outer transaction cache consistency
        run: |
          set -euo pipefail
          for cache in memory redis; do
            docker run --rm --network host --entrypoint php \
              --mount "type=bind,source=$GITHUB_WORKSPACE/revento,target=/qualification,readonly" \
              -e REVENTO_DATABASE_AUTOLOAD=/usr/src/code/vendor/autoload.php \
              -e REVENTO_DATABASE_SOURCE=/usr/src/code/vendor/utopia-php/database/src/Database/Database.php \
              -e 'RELATION_PG_DSN=pgsql:host=127.0.0.1;port=5432;dbname=relation_probe' \
              -e RELATION_PG_USER=relation_probe \
              -e RELATION_PG_PASSWORD=synthetic-ci-only \
              -e "RELATION_CACHE=$cache" \
              -e RELATION_OWNED_REDIS=127.0.0.1:6379 \
              revento/appwrite:qualification /qualification/tests/eng2091-transaction-cache.php
          done
